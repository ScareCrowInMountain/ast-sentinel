name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov ruff mypy
          pip install -e .

      - name: Lint with ruff
        run: |
          ruff check ast_sentinel tests --exclude tests/samples

      - name: Type check with mypy
        run: |
          mypy ast_sentinel --ignore-missing-imports

      - name: Run unit test suite
        run: |
          pytest -v --tb=short

      - name: Dogfooding (Self-scan AST-Sentinel)
        run: |
          python3 -m ast_sentinel.cli ast_sentinel --severity HIGH

      - name: Generate OASIS SARIF Report
        if: matrix.python-version == '3.12'
        run: |
          python3 -m ast_sentinel.cli ast_sentinel --format sarif --output results.sarif

      - name: Upload SARIF report to GitHub Code Scanning
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: results.sarif
